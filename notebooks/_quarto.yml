lang: en-US
author:
  - id: dfolio
    name: David Folio
    orcid: 0000-0001-9430-6091
    email: david.folio@insa-cvl.fr
    url: https://dfolio.fr

bibliography: ../docs/references.bib

keep-ipynb: false
format:
  html:
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: true
    fig-cap-location: bottom
    fig-format: "svg"
    fig-responsive: true
    lightbox: true
    number-sections: true
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  pdf:
    pdf-engine: xelatex
    classoption: ['openright','twoside', 'headings=normal','headsepline','footsepline']
    geometry: [a4paper,bindingoffset=0.25cm, marginparwidth=0in,marginparsep=0in,headsep=1ex,footskip=0.75cm,margin=2.cm,centering,]
    toc: false
    # toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: true
    svg: true
    fig-format: svg
    graphics: true
    fig-cap-location: bottom
    number-sections: true
    include-in-header:
      text: |
        \usepackage{physics}
        \usepackage{siunitx}
  ipynb:
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: true
    fig-cap-location: bottom
    fig-format: "svg"
    fig-responsive: true
    lightbox: true
    number-sections: true
execute:
  freeze: auto
  # freeze: false
  warning: false
  echo: true
  output: true

jupyter: python3
