[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetofluidics-pinn"
# version = "0.1.0"
dynamic = ["version"]
description = "Physics-informed neural networks for magnetic particle transport in viscous microfluidic flows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.*"]

authors = [
    {name = "David FOLIO", email = "david.folio@insa-cvl.fr"}
]
maintainers = [
    {name = "David FOLIO", email = "david.folio@insa-cvl.fr"}
]
keywords = [
    "physics-informed-neural-networks",
    "microfluidics",
    "magnetic-microrobots",
    "stokes-flow",
    "navier-stokes",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "numpy>=2.5.0",
    "scipy>=1.11",
    "torch>=2.13.0",
    "matplotlib>=3.10.0",
    "pandas>=2.3.0",  # Used in notebook
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["magnetofluidics_pinn*"]

[tool.setuptools.dynamic]
version = {attr = "magnetofluidics_pinn.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["magnetofluidics_pinn"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
extend-exclude = []

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
