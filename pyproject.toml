[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetofluidics-pinn"
# version = "0.1.0"
dynamic = ["version"]
description = "Physics-informed neural networks for magnetic particle transport in viscous microfluidic flows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E.*"]

authors = [
    {name = "David FOLIO", email = "david.folio@insa-cvl.fr"}
]
maintainers = [
    {name = "David FOLIO", email = "david.folio@insa-cvl.fr"}
]
keywords = [
    "physics-informed-neural-networks",
    "microfluidics",
    "magnetic-microrobots",
    "stokes-flow",
    "navier-stokes",
]

dependencies = [
    "numpy>=2.5.0",
    "scipy>=1.11",
    "torch>=2.13.0",
    "matplotlib>=3.10.0",
    "pandas>=2.3.0",  # Used in notebook
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["magnetofluidics_pinn*"]

[tool.setuptools.dynamic]
version = {attr = "magnetofluidics_pinn.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
